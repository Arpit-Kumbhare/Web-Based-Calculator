<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculator made using HTML, CSS and JavaScript for practice purposes">
    <meta name="robots" content="noindex, nofollow">
    <meta name="keywords" content="html,css,javascript,project,development,web-development">

    <link rel="stylesheet" href="style.css">

    <title>Calculator</title>
</head>
<body>
    <header>
        <h1 id="heading">Welcome To Calculator</h1>
    </header>

    <main>

        <div class="display-bar">
            <input class="input-bar" type="text">
        </div>

        <div class="button-grid">
            <button class="buttom">1</button>
            <button class="buttom">2</button>
            <button class="buttom">3</button>
            <button class="buttom">+</button>
            <button class="buttom">4</button>
            <button class="buttom">5</button>
            <button class="buttom">6</button>
            <button class="buttom">-</button>
            <button class="buttom">7</button>
            <button class="buttom">8</button>
            <button class="buttom">9</button>
            <button class="buttom">*</button>
            <button class="buttom">C</button>
            <button class="buttom">0</button>
            <button class="buttom">=</button>
            <button class="buttom">/</button>
        </div>

    </main>


    <script src="script.js" defer></script>
</body>
</html>
